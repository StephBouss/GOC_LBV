  <!-- Navigation de la rubrique -->
  <!-- sous-nav -->

  <!-- ═══════════ 1 · Ouverture ═══════════ -->
  <section class="page-hero" aria-labelledby="page-titre">
    <img class="page-hero-image" style="object-position: 85% 40%" src="img/photos/actualites-hero.jpg" srcset="img/photos/actualites-hero-768.jpg 768w, img/photos/actualites-hero.jpg 2400w" sizes="100vw" alt="" width="2400" height="1030" fetchpriority="high">
    <div class="voile" aria-hidden="true"></div>
    <div class="conteneur page-hero-contenu">
      <div class="page-hero-bloc">
        <p class="sur-titre clair">News</p>
        <h1 class="page-hero-titre" id="page-titre">News and highlights</h1>
        <p class="page-hero-chapo">Discover GOC's latest initiatives, strategic milestones and operational achievements.</p>
      </div>
    </div>
  </section>

  <!-- ═══════════ 2 · Articles (modèle home.html : 20 articles au plus, filtrables par catégorie) ═══════════ -->
  <section class="section" aria-labelledby="liste-titre">
    <div class="conteneur">
      <div data-apparition>
        <p class="sur-titre">All news</p>
        <h2 class="titre-section marge-40" id="liste-titre">The latest news from the Group</h2>
      </div>

      <div class="filtres-barre" data-apparition>
        <nav class="filtres" aria-label="Filter news by category">
          <ul>
          <!-- actualites:filtres -->
          </ul>
        </nav>
        <p class="filtres-statut" role="status">{{actualites:nombre}} articles</p>
      </div>

      <div class="liste-actus" data-cascade>
        <!-- actualites:liste -->
      </div>
    </div>
  </section>

  <!-- ═══════════ 3 · Lettre d'information ═══════════ -->
  <section class="section fond-surface" aria-labelledby="lettre-titre">
    <div class="conteneur lettre" data-apparition>
      <div>
        <p class="sur-titre">Newsletter</p>
        <h2 class="titre-section marge-16" id="lettre-titre">Stay informed</h2>
        <p class="lettre-texte">Subscribe to our newsletter to receive the latest GOC news.</p>
      </div>
      <!-- Envoi : action="…" reçoit l'adresse d'inscription de l'outil d'envoi de la lettre (Brevo, Mailchimp… voir INVENTAIRE.md) -->
      <form class="lettre-formulaire" method="post" data-envoi data-merci="Thank you, your subscription has been registered. You will receive our next news by email.">
        <div class="lettre-champ">
          <label class="visuellement-masque" for="lettre-email">Email address</label>
          <input id="lettre-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <button class="bouton" type="submit">Subscribe</button>
        </div>
        <div class="consentement">
          <input id="lettre-consentement" name="consentement" type="checkbox" value="oui" required>
          <label for="lettre-consentement">I agree to receive GOC's newsletter and can unsubscribe at any time. See the <a href="legal/privacy-policy.html" target="_blank" rel="noopener">privacy policy<span class="visuellement-masque"> (opens in a new tab)</span></a>.</label>
        </div>
        <p class="statut-formulaire" role="status"></p>
      </form>
    </div>
  </section>
